<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://rpc.mainnet.arc.io; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book — ShowUp</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header class="top"><a href="./">ShowUp</a><nav><a href="book.html">Book</a><a href="shop.html">For shops</a></nav></header>
<h1 id="title">Book a slot</h1>
<p class="lead" id="terms">Loading shop…</p>
<div id="nowallet" class="card" hidden></div>
<label for="shop">Shop number</label><input id="shop" type="number" min="1" value="1">
<label for="slot">Your time <span class="muted" id="tz"></span></label><input id="slot" type="datetime-local">
<p><button id="go" disabled>Lock deposit and book</button></p>
<div id="msg" aria-live="polite"></div>
<h2>My bookings</h2><div id="mine" class="muted">Connect your wallet to see your bookings. <button class="ghost" id="conn">Connect</button></div>
</main>
<script type="module" src="book.js"></script>
</body></html>
